[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgcluster"
version = "0.2.0"
description = "PostgreSQL cluster topology deployment tool"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
pgcluster = "pgclusterlib.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
