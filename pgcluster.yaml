version: 1

postgres:
  home: ${PGHOME:-/usr/local/pgsql18.3}

operation_log: ${PGCLUSTER_LOG:-/home/postgres/operation.log}

hosts:
  host1: 127.0.0.1

nodes:
  pub1:
    host: host1
    port: 15432
    data_dir: ${PGDATA1:-/data/c1/pub1}
  pub2:
    host: host1
    port: 15433
    data_dir: ${PGDATA2:-/data/c1/pub2}
  sub1:
    host: host1
    port: 25432
    data_dir: ${PGDATA3:-/data/c1/sub1}
  sub2:
    host: host1
    port: 25433
    data_dir: ${PGDATA4:-/data/c1/sub2}

clusters:
  publisher:
    type: streaming
    primary: pub1
    standbys:
      - node: pub2
        slot: pub2_physical_slot
  subscriber:
    type: streaming
    primary: sub1
    standbys:
      - node: sub2
        slot: sub2_physical_slot
  c1:
    type: logical
    publisher: publisher
    subscriber: subscriber
    tables: all
    publication: c1_pub
    subscription: c1_sub
    slot: c1_failover_slot
    copy_data: true
    failover: true
