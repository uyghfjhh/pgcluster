version: 1

postgres:
  home: ${PGHOME:-/usr/local/pgsql18.3}

operation_log: ${PGCLUSTER_LOG:-/home/postgres/operation.log}

hosts:
  host1: 127.0.0.1

nodes:
  pub1:
    host: host1
    port: 15432
    data_dir: ${PGDATA1:-/data/c1/pub1}
  pub2:
    host: host1
    port: 15433
    data_dir: ${PGDATA2:-/data/c1/pub2}
  sub1:
    host: host1
    port: 25432
    data_dir: ${PGDATA3:-/data/c1/sub1}
  sub2:
    host: host1
    port: 25433
    data_dir: ${PGDATA4:-/data/c1/sub2}
  c21:
    host: host1
    port: 16432
    data_dir: ${PGDATA5:-/data/c2/c21}
  c22:
    host: host1
    port: 16433
    data_dir: ${PGDATA6:-/data/c2/c22}
  c31:
    host: host1
    port: 17432
    data_dir: ${PGDATA7:-/data/c3/c31}
  c32:
    host: host1
    port: 17433
    data_dir: ${PGDATA8:-/data/c3/c32}

clusters:
  publisher:
    type: streaming
    primary: pub1
    standbys:
      - node: pub2
        slot: pub2_physical_slot
  subscriber:
    type: streaming
    primary: sub1
    standbys:
      - node: sub2
        slot: sub2_physical_slot
  c1:
    type: logical
    publisher: publisher
    subscriber: subscriber
    tables: all
    publication: c1_pub
    subscription: c1_sub
    slot: c1_failover_slot
    copy_data: true
    failover: true
  c2:
    type: streaming
    primary: c21
    standbys:
      - node: c22
        slot: c22_physical_slot
  c3_publisher:
    type: streaming
    primary: c31
  c3_subscriber:
    type: streaming
    primary: c32
  c3:
    type: logical
    publisher: c3_publisher
    subscriber: c3_subscriber
    tables: all
    publication: c3_pub
    subscription: c3_sub
    slot: c3_slot
    copy_data: true
    failover: false
