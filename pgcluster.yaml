version: 1

postgres:
  home: ${PGHOME:-/usr/local/pgsql18.3}

operation_log: ${PGCLUSTER_LOG:-/home/postgres/operation.log}

hosts:
  host1: 127.0.0.1

nodes:
  pub1:
    host: host1
    port: 15432
    data_dir: ${PGDATA1:-/home/postgres/delopy/pgcluster/data/logical1/pub1}
  pub2:
    host: host1
    port: 15433
    data_dir: ${PGDATA2:-/home/postgres/delopy/pgcluster/data/logical1/pub2}
  sub1:
    host: host1
    port: 25432
    data_dir: ${PGDATA3:-/home/postgres/delopy/pgcluster/data/logical1/sub1}
  sub2:
    host: host1
    port: 25433
    data_dir: ${PGDATA4:-/home/postgres/delopy/pgcluster/data/logical1/sub2}

clusters:
  publisher:
    type: streaming
    primary: pub1
    standbys:
      - node: pub2
        slot: pub2_physical_slot
  subscriber:
    type: streaming
    primary: sub1
    standbys:
      - node: sub2
        slot: sub2_physical_slot
  logical1:
    type: logical
    publisher: publisher
    subscriber: subscriber
    tables: all
    publication: logical1_pub
    subscription: logical1_sub
    slot: logical1_failover_slot
    copy_data: true
    failover: true
